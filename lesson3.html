<!DOCTYPE html>

<html>
    <style>
        td {
            text-align: center;
        }
        tr {
            border: 1px solid gray;
        }
        table {
            border-collapse: collapse;
            width: 50%;
            margin : auto;
        }
        div{
            border: 1px dotted blue;
            width: 50%;
            margin:auto;
            padding-top: 24px;
            padding-bottom: 24px;
        }
        .green {
            color: green;
            background-color: blue;
        }
    </style>
    <body>
        <div>
            <table>
                <caption>Zoo</caption>
                <tr>
                    <th>Name</th>
                    <th>Animal</th>
                </tr>
                <tr>
                    <td class="green">Tim</td>
                    <td class="green">Dog</td>
                </tr>
                <tr>
                    <td>Jim</td>
                    <td>Zebra</td>
                </tr>
                <tr>
                    <td>Kate</td>
                    <td>Lion</td>
                </tr>
            </table>
        </div>
    </body>
</html>
